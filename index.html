<style>
/* ============ 设计 Token ============ */
:root {
  --color-primary: #1E3A8A;
  --color-primary-soft: #E0E7FF;
  --color-morning: #2563EB;
  --color-afternoon: #0D9488;
  --color-evening: #7C3AED;
  --color-text: #111827;
  --color-text-secondary: #4B5563;
  --color-text-tertiary: #9CA3AF;
  --color-bg: #F5F7FB;
  --color-surface: #FFFFFF;
  --color-border: #E5E7EB;
  --color-success: #059669;
  --color-warn: #D97706;

  --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;

  --text-2xl: 20px;
  --text-xl: 17px;
  --text-base: 15px;
  --text-sm: 13px;
  --text-xs: 12px;

  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 8px;

  --shadow-card: 0 1px 3px rgba(17, 24, 39, .06), 0 1px 2px rgba(17, 24, 39, .04);
  --shadow-card-hover: 0 6px 16px rgba(17, 24, 39, .10), 0 2px 6px rgba(17, 24, 39, .06);
}

/* ============ 基础 ============ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: 1.6;
  color: var(--color-text);
  background: var(--color-bg);
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
a { color: inherit; text-decoration: none; }

.app {
  max-width: 1080px;
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 0px) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ============ 顶部标题栏 ============ */
.app-header {
  position: sticky; top: 0; z-index: 20;
  background: rgba(245, 247, 251, .88);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--color-border);
}
.header-inner {
  max-width: 1080px; margin: 0 auto;
  padding: 12px 16px 8px;
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
}
.header-title {
  font-size: var(--text-2xl); font-weight: 700; color: var(--color-primary);
  letter-spacing: .2px;
}
.header-sub { font-size: var(--text-sm); color: var(--color-text-secondary); font-weight: 400; white-space: nowrap; }
.header-today {
  font-size: var(--text-xs); color: var(--color-success);
  background: rgba(5, 150, 105, .10);
  padding: 2px 8px; border-radius: 999px; font-weight: 500;
  white-space: nowrap;
}

/* ============ 周选择器 ============ */
.week-bar {
  max-width: 1080px; margin: 0 auto;
  padding: 6px 16px 4px;
  display: flex; align-items: center; gap: 8px;
}
.week-arrow {
  flex: 0 0 auto;
  width: 40px; height: 40px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  color: var(--color-primary);
  transition: transform .15s ease-out, background .2s;
}
.week-arrow:active { transform: scale(.92); }
.week-arrow:disabled { opacity: .35; cursor: default; }
.week-arrow:disabled:active { transform: none; }
.week-arrow svg { width: 18px; height: 18px; }
.week-label {
  flex: 1 1 auto; min-width: 0;
  height: 40px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--color-primary);
  color: #fff;
  font-size: var(--text-base); font-weight: 700;
  letter-spacing: .3px;
  transition: transform .15s ease-out, filter .2s;
}
.week-label:active { transform: scale(.97); }
.week-label .week-dates {
  font-size: var(--text-xs); font-weight: 500; opacity: .85;
  font-variant-numeric: tabular-nums;
}
.week-label .chevron { width: 14px; height: 14px; opacity: .7; transition: transform .25s ease-out; }
.week-label.open .chevron { transform: rotate(180deg); }
/* 中央按钮提示：当前不在真实周时描边提醒 */
.week-label.not-this-week { box-shadow: 0 0 0 2px rgba(5, 150, 105, .6); }
.week-label .week-notice {
  display: none;
  font-size: var(--text-xs); font-weight: 600; color: #A7F3D0;
  white-space: nowrap;
}
.week-label.not-this-week .week-notice { display: inline; }

/* 返回本周按钮：位于周选择面板顶部，远离箭头避免误触 */
.week-today-btn {
  width: 100%; height: 44px; border-radius: 12px;
  font-size: var(--text-sm); font-weight: 700;
  color: #fff;
  background: var(--color-success);
  box-shadow: 0 2px 8px rgba(5, 150, 105, .28);
  display: none; align-items: center; justify-content: center; gap: 6px;
  margin-bottom: 10px;
  transition: transform .15s ease-out;
}
.week-today-btn:active { transform: scale(.97); }
.week-today-btn svg { width: 16px; height: 16px; }
.week-today-btn.visible { display: flex; }

/* 周选择面板 */
.week-picker {
  max-width: 1080px; margin: 0 auto;
  padding: 0 16px 10px;
  display: none;
}
.week-picker.open { display: block; animation: fadeDown .18s ease-out; }
@keyframes fadeDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.week-picker-inner {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: 12px;
  box-shadow: var(--shadow-card);
}
.week-picker-title { font-size: var(--text-xs); color: var(--color-text-tertiary); margin-bottom: 8px; font-weight: 600; }
.week-grid-pick {
  display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px;
}
.week-pick-btn {
  height: 40px; border-radius: 10px;
  font-size: var(--text-sm); font-weight: 600;
  color: var(--color-text-secondary);
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.25;
  transition: transform .12s ease-out, background .15s, color .15s;
}
.week-pick-btn small { font-size: 10px; font-weight: 400; opacity: .65; }
.week-pick-btn:active { transform: scale(.94); }
.week-pick-btn[aria-pressed="true"] {
  background: var(--color-primary); color: #fff; border-color: var(--color-primary);
}
.week-pick-btn.no-course { opacity: .45; }
.week-pick-btn:focus-visible {
  outline: 2px solid var(--color-primary); outline-offset: 2px;
}

/* ============ 主内容 ============ */
main { padding: 12px 16px 40px; max-width: 1080px; margin: 0 auto; }

.week-empty-banner {
  background: var(--color-surface);
  border: 1px dashed var(--color-border);
  border-radius: var(--radius-md);
  padding: 22px 16px;
  text-align: center;
  font-size: var(--text-sm); color: var(--color-text-tertiary);
  margin-bottom: 16px;
}
.week-empty-banner svg { width: 26px; height: 26px; opacity: .5; margin-bottom: 6px; }

/* 周视图：每一天为一块卡片，按屏幕宽度自适应多列（手机约 3 列，桌面 5 列横排），无横向滚动 */
.week-view {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 100px), 1fr));
  gap: 10px;
  align-items: start;
  padding: 2px 2px 12px;
}
.day-block {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  scroll-snap-align: start;
  display: flex; flex-direction: column;
  min-width: 0;
}
.day-block.is-today { border-color: rgba(5, 150, 105, .55); box-shadow: 0 0 0 1px rgba(5,150,105,.25), var(--shadow-card); }
.day-head {
  display: flex; align-items: center; gap: 8px;
  flex-wrap: wrap;
  padding: 12px 14px 10px;
  border-bottom: 1px solid var(--color-border);
  background: linear-gradient(180deg, rgba(224, 231, 255, .45), rgba(224, 231, 255, 0));
}
.day-name { font-size: var(--text-base); font-weight: 700; color: var(--color-primary); white-space: nowrap; }
.day-date { font-size: var(--text-xs); color: var(--color-text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
.day-today-tag {
  margin-left: auto;
  font-size: var(--text-xs); font-weight: 600; color: #fff;
  background: var(--color-success); border-radius: 999px; padding: 2px 8px;
  flex: 0 0 auto;
}
.day-body { padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 10px; }

/* 时段分组（一天内） */
.period-group { display: flex; flex-direction: column; gap: 8px; }
.period-head {
  display: flex; align-items: center; gap: 6px;
  flex-wrap: wrap;
}
.period-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
.period-dot.morning { background: var(--color-morning); }
.period-dot.afternoon { background: var(--color-afternoon); }
.period-dot.evening { background: var(--color-evening); }
.period-name { font-size: var(--text-xs); font-weight: 700; color: var(--color-text-secondary); }
.period-time {
  font-size: var(--text-xs); color: var(--color-text-tertiary);
  font-variant-numeric: tabular-nums;
}

/* 课程卡片 */
.course-card {
  position: relative;
  display: grid; gap: 4px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: 10px 10px 10px 14px;
  box-shadow: var(--shadow-card);
  transition: transform .2s ease-out, box-shadow .2s ease-out;
}
.course-card::before {
  content: ""; position: absolute; left: 0; top: 8px; bottom: 8px;
  width: 4px; border-radius: 0 2px 2px 0;
}
.course-card.morning::before { background: var(--color-morning); }
.course-card.afternoon::before { background: var(--color-afternoon); }
.course-card.evening::before { background: var(--color-evening); }
.course-card:active { transform: scale(.98); }
.course-card:hover { box-shadow: var(--shadow-card-hover); }
.course-name { font-size: var(--text-sm); font-weight: 600; line-height: 1.4; }
.course-meta {
  display: flex; flex-direction: column; gap: 3px;
  font-size: var(--text-xs); color: var(--color-text-secondary);
}
.meta-item { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
.meta-item svg { width: 13px; height: 13px; flex: 0 0 auto; opacity: .75; }
.meta-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 时段空态 */
.period-empty { font-size: var(--text-xs); color: var(--color-text-tertiary); padding: 4px 2px; opacity: .85; }

/* 天空态（当天完全无课） */
.day-empty {
  padding: 16px 12px;
  text-align: center;
  font-size: var(--text-sm); color: var(--color-text-tertiary);
}

/* ============ 桌面端（≥768px）：5 列等分铺满 ============ */
@media (min-width: 768px) {
  .week-view {
    grid-template-columns: repeat(5, 1fr);
  }
  .day-body { gap: 10px; }
}

/* ============ 备注折叠区 ============ */
.notes { margin-top: 28px; }
.notes-title {
  font-size: var(--text-base); font-weight: 700;
  color: var(--color-text-secondary);
  margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
}
.notes-title svg { width: 16px; height: 16px; opacity: .8; }
.note-panel {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  margin-bottom: 10px;
  overflow: hidden;
}
.note-summary {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px;
  font-size: var(--text-base); font-weight: 600;
  cursor: pointer;
  list-style: none;
}
.note-summary::-webkit-details-marker { display: none; }
.note-summary .note-icon { display: inline-flex; align-items: center; gap: 8px; }
.note-summary .note-icon svg { width: 17px; height: 17px; opacity: .7; }
.note-summary .chevron {
  width: 18px; height: 18px; opacity: .6;
  transition: transform .25s ease-out;
}
details[open] .note-summary .chevron { transform: rotate(180deg); }
.note-body { padding: 0 16px 14px; }
.note-body ul { list-style: none; }
.note-body li {
  position: relative; padding: 6px 0 6px 14px;
  font-size: var(--text-sm); color: var(--color-text-secondary);
  line-height: 1.7;
}
.note-body li::before {
  content: ""; position: absolute; left: 0; top: 14px;
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--color-text-tertiary);
}
.note-body li.adjust::before { background: var(--color-warn); }

/* ============ 添加到主屏幕引导 ============ */
.install-tip {
  display: flex; align-items: flex-start; gap: 10px;
  background: var(--color-primary-soft);
  border: 1px solid rgba(30, 58, 138, .18);
  border-radius: var(--radius-md);
  padding: 12px 14px; margin-top: 20px;
  font-size: var(--text-sm); color: var(--color-primary);
}
.install-tip svg { width: 18px; height: 18px; flex: 0 0 auto; margin-top: 2px; }
.install-tip .tip-close {
  margin-left: auto; flex: 0 0 auto;
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--color-primary); opacity: .7;
}
.install-tip .tip-close:hover { opacity: 1; background: rgba(30,58,138,.08); }
.hidden { display: none !important; }

/* ============ 页脚 ============ */
.app-footer {
  max-width: 1080px; margin: 0 auto;
  padding: 0 16px calc(env(safe-area-inset-bottom) + 24px);
  text-align: center;
  font-size: var(--text-xs); color: var(--color-text-tertiary);
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

<script>
(function () {
  "use strict";
  var D = window.SCHEDULE_DATA;

  /* ---------- 教学周参数 ---------- */
  var TOTAL_WEEKS = 18;                       // 第 1 周报到（9月6日），课程自第 2 周起
  var TERM_START = new Date(2026, 8, 6);      // 2026-09-06（周日），第 1 周起点

  var periodMeta = {
    morning:   { label: "上午",  time: "8:30-11:50", className: "morning" },
    afternoon: { label: "下午",  time: "14:00-17:10", className: "afternoon" },
    evening:   { label: "晚上",  time: "18:30-21:00", className: "evening" }
  };

  var currentWeek = defaultWeek();
  var followToday = true;   // 跟随"真实当前周"：刷新自动定位；手动切周后暂停，返回本周恢复

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    headerTitle: $("headerTitle"), headerSub: $("headerSub"), headerToday: $("headerToday"),
    weekLabel: $("weekLabel"), weekLabelMain: $("weekLabelMain"), weekLabelDates: $("weekLabelDates"),
    weekPicker: $("weekPicker"), weekGridPick: $("weekGridPick"),
    prevWeek: $("prevWeek"), nextWeek: $("nextWeek"), weekTodayBtn: $("weekTodayBtn"),
    weekView: $("weekView"), weekEmptyBanner: $("weekEmptyBanner"),
    noteAdjustList: $("noteAdjustList"), noteArrangeList: $("noteArrangeList"),
    installTip: $("installTip"), installTipClose: $("installTipClose"),
    appFooter: $("appFooter")
  };

  /* ---------- 工具 ---------- */
  function defaultWeek() {
    var now = new Date();
    var diffDays = Math.floor((now - TERM_START) / 86400000);
    var wk = Math.floor(diffDays / 7) + 1;
    return Math.min(Math.max(wk, 1), TOTAL_WEEKS);
  }

  function weekDates(w) {
    // 返回该周周一 ~ 周五的 Date 数组
    var monday = new Date(TERM_START.getTime() + (w - 1) * 7 * 86400000 + 1 * 86400000);
    var arr = [];
    for (var i = 0; i < 5; i++) arr.push(new Date(monday.getTime() + i * 86400000));
    return arr;
  }

  function fmtDate(d) {
    return (d.getMonth() + 1) + "月" + d.getDate() + "日";
  }

  function fmtRange(w) {
    var dates = weekDates(w);
    return fmtDate(dates[0]) + " - " + fmtDate(dates[4]);
  }

  function parseWeeks(nature) {
    // "2-9周" → [2,9]；"从第二周开始" → [2, TOTAL]；无 → [1, TOTAL]
    if (!nature) return [1, TOTAL_WEEKS];
    var m = nature.match(/(\d+)\s*[-—~至]\s*(\d+)\s*周/);
    if (m) return [parseInt(m[1], 10), parseInt(m[2], 10)];
    m = nature.match(/从第?([一二三四五六七八九十\d]+)周/);
    if (m) {
      var cn = m[1];
      var num = "一二三四五六七八九".indexOf(cn) + 1;
      if (cn === "十") num = 10;
      if (/^\d+$/.test(cn)) num = parseInt(cn, 10);
      if (num >= 1) return [num, TOTAL_WEEKS];
    }
    return [1, TOTAL_WEEKS];
  }

  function courseInWeek(c, w) {
    var r = parseWeeks(c.nature);
    return w >= r[0] && w <= r[1];
  }

  function weekHasCourse(w) {
    for (var i = 0; i < D.days.length; i++) {
      for (var pid in periodMeta) {
        var list = D.days[i].courses[pid] || [];
        for (var j = 0; j < list.length; j++) {
          if (courseInWeek(list[j], w)) return true;
        }
      }
    }
    return false;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function todayIdx() {
    var now = new Date();
    var d = now.getDay();
    return (d >= 1 && d <= 5) ? d - 1 : -1;
  }

  function isCurrentWeek() {
    var now = new Date();
    var diffDays = Math.floor((now - TERM_START) / 86400000);
    var wk = Math.floor(diffDays / 7) + 1;
    return wk === currentWeek;
  }

  /* 将今天的卡片滚动到可视范围内（仅当前周且已开学时；周视图已改为多列网格，无需横向滚动） */
  function scrollToToday() {
    var now = new Date();
    var diffDays = Math.floor((now - TERM_START) / 86400000);
    if (diffDays < 0 || !isCurrentWeek()) return;
    var t = todayIdx();
    if (t < 0) return;
    var el = document.getElementById("day-" + t);
    if (el && el.scrollIntoView) {
      try { el.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" }); } catch (e) {}
    }
  }

  /* 轻量时钟：每分钟检查一次日期；
     ① 跨周（跟随模式下）→ 自动定位到新周
     ② 同周跨天 → 自动刷新"今天"高亮并滚动到新今天列
     手动切到其他周时保持不动，尊重用户选择 */
  function dayKey(d) {
    return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
  }
  var lastDayKey = dayKey(new Date());

  function initClock() {
    setInterval(function () {
      var now = new Date();
      var k = dayKey(now);
      if (k === lastDayKey) return;   // 日期未变，跳过
      lastDayKey = k;
      var w = defaultWeek();
      var viewIsRealWeek = (w === currentWeek);
      if (viewIsRealWeek || followToday) {
        currentWeek = w;
        refresh();
        setTimeout(scrollToToday, 80);
      }
      // 手动看其他周（非跟随）→ 保持不动
    }, 60000);
  }

  /* ---------- 渲染：周选择器 ---------- */
  function renderWeekBar() {
    els.weekLabelMain.textContent = "第 " + currentWeek + " 周";
    els.weekLabelDates.textContent = fmtRange(currentWeek);
    els.prevWeek.disabled = currentWeek <= 1;
    els.nextWeek.disabled = currentWeek >= TOTAL_WEEKS;
    // 是否显示"返回本周"（只要当前不在真实周就显示，开学前也允许）
    var now = new Date();
    var diffDays = Math.floor((now - TERM_START) / 86400000);
    var realWeek = Math.min(Math.max(Math.floor(diffDays / 7) + 1, 1), TOTAL_WEEKS);
    if (realWeek !== currentWeek) {
      els.weekTodayBtn.classList.add("visible");
      els.weekLabel.classList.add("not-this-week");
    } else {
      els.weekTodayBtn.classList.remove("visible");
      els.weekLabel.classList.remove("not-this-week");
    }
  }

  function renderWeekPicker() {
    var html = "";
    for (var w = 1; w <= TOTAL_WEEKS; w++) {
      var has = weekHasCourse(w);
      var pressed = w === currentWeek ? ' aria-pressed="true"' : "";
      var noCls = has ? "" : " no-course";
      var dates = weekDates(w);
      var label = "第" + w + "周";
      var sub = (dates[0].getMonth() + 1) + "/" + dates[0].getDate();
      html += '<button class="week-pick-btn' + noCls + '" data-week="' + w + '"' + pressed + '>' +
        label + "<small>" + sub + "</small></button>";
    }
    els.weekGridPick.innerHTML = html;
    els.weekGridPick.querySelectorAll(".week-pick-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        currentWeek = parseInt(btn.dataset.week, 10);
        followToday = false;
        closePicker();
        refresh();
      });
    });
  }

  function openPicker() {
    renderWeekPicker();
    els.weekPicker.classList.add("open");
    els.weekLabel.classList.add("open");
    els.weekLabel.setAttribute("aria-expanded", "true");
  }
  function closePicker() {
    els.weekPicker.classList.remove("open");
    els.weekLabel.classList.remove("open");
    els.weekLabel.setAttribute("aria-expanded", "false");
  }

  /* ---------- 渲染：课程卡片 ---------- */
  function courseCard(c, cls) {
    var meta = "";
    if (c.teacher) {
      meta += '<span class="meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>' + escapeHtml(c.teacher) + "</span></span>";
    }
    if (c.location) {
      meta += '<span class="meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span>' + escapeHtml(c.location) + "</span></span>";
    }
    return '<article class="course-card ' + cls + '">' +
      '<h3 class="course-name">' + escapeHtml(c.name) + "</h3>" +
      '<div class="course-meta">' + meta + "</div></article>";
  }

  /* ---------- 渲染：整周视图 ---------- */
  function renderWeekView() {
    var dates = weekDates(currentWeek);
    var tIdx = todayIdx();
    var anyCourse = false;
    var html = "";

    D.days.forEach(function (day, i) {
      var d = dates[i];
      var isToday = (isCurrentWeek() && i === tIdx);
      html += '<section class="day-block' + (isToday ? " is-today" : "") + '" id="day-' + i + '">';
      html += '<div class="day-head">';
      html += '<span class="day-name">' + day.name + "</span>";
      html += '<time class="day-date" datetime="' + d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate() + '">' + fmtDate(d) + "</time>";
      if (isToday) html += '<span class="day-today-tag">今天</span>';
      html += "</div>";

      var dayHas = false;
      var body = '<div class="day-body">';
      D.periods.forEach(function (p) {
        var meta = periodMeta[p.id];
        var courses = (day.courses[p.id] || []).filter(function (c) { return courseInWeek(c, currentWeek); });
        if (courses.length === 0) return; // 该时段无课则不显示
        dayHas = true;
        anyCourse = true;
        body += '<div class="period-group">';
        body += '<div class="period-head">';
        body += '<span class="period-dot ' + meta.className + '" aria-hidden="true"></span>';
        body += '<span class="period-name">' + meta.label + "</span>";
        body += '<time class="period-time">' + meta.time + "</time>";
        body += "</div>";
        courses.forEach(function (c) { body += courseCard(c, meta.className); });
        body += "</div>";
      });

      if (!dayHas) {
        body += '<div class="day-empty">本周' + day.name + '暂无课程</div>';
      }
      body += "</div>";
      html += body + "</section>";
    });

    els.weekView.innerHTML = html;
    els.weekEmptyBanner.classList.toggle("hidden", anyCourse);
  }

  /* ---------- 渲染：备注 ---------- */
  function renderNotes() {
    var a = "";
    (D.notes.adjust || []).forEach(function (t) { a += '<li class="adjust">' + escapeHtml(t) + "</li>"; });
    els.noteAdjustList.innerHTML = a;
    var b = "";
    (D.notes.arrange || []).forEach(function (t) { b += "<li>" + escapeHtml(t) + "</li>"; });
    els.noteArrangeList.innerHTML = b;
  }

  /* ---------- 头部 ---------- */
  function updateHeader() {
    var title = D.title.replace("（" + D.grade + "）", "").replace("2026-2027学年第一学期全日制", "");
    els.headerTitle.textContent = title;
    els.headerSub.textContent = D.semester + " · " + D.program;
    var tIdx = todayIdx();
    els.headerToday.hidden = !(tIdx >= 0);
  }

  /* ---------- 刷新 ---------- */
  function refresh() {
    updateHeader();
    renderWeekBar();
    renderWeekView();
    renderWeekPicker();
  }

  /* ---------- 安装引导 ---------- */
  function initInstallTip() {
    var iOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    var standalone = window.navigator.standalone === true ||
      window.matchMedia("(display-mode: standalone)").matches;
    if (!iOS || standalone || localStorage.getItem("wb-mba-timetable-tip-closed") === "1") return;
    els.installTip.hidden = false;
    els.installTipClose.addEventListener("click", function () {
      els.installTip.hidden = true;
      try { localStorage.setItem("wb-mba-timetable-tip-closed", "1"); } catch (e) {}
    });
  }

  /* ---------- 启动 ---------- */
  function init() {
    els.prevWeek.addEventListener("click", function () {
      followToday = false;
      if (currentWeek > 1) { currentWeek--; refresh(); }
    });
    els.nextWeek.addEventListener("click", function () {
      followToday = false;
      if (currentWeek < TOTAL_WEEKS) { currentWeek++; refresh(); }
    });
    els.weekLabel.addEventListener("click", function () {
      if (els.weekPicker.classList.contains("open")) closePicker();
      else openPicker();
    });
    els.weekTodayBtn.addEventListener("click", function () {
      var now = new Date();
      var diffDays = Math.floor((now - TERM_START) / 86400000);
      currentWeek = Math.min(Math.max(Math.floor(diffDays / 7) + 1, 1), TOTAL_WEEKS);
      followToday = true;
      closePicker();
      refresh();
      setTimeout(scrollToToday, 80);
    });
    document.addEventListener("click", function (e) {
      if (els.weekPicker.classList.contains("open") &&
          !els.weekPicker.contains(e.target) && e.target !== els.weekLabel) {
        closePicker();
      }
    });

    renderNotes();
    refresh();
    scrollToToday();
    initClock();
    initInstallTip();
    els.appFooter.textContent = "数据来源：2026级全日制第一学期课程表.xlsx · 页面可离线使用";
  }

  document.readyState === "loading"
    ? document.addEventListener("DOMContentLoaded", init)
    : init();
})();
</script>
</body>
</html>
