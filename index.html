/* ============ 设计 Token ============ */
:root {
  /* macOS 系统色板（浅色外观） */
  --color-primary: #007AFF;            /* 系统蓝 */
  --color-morning: #0A84FF;            /* 上午 · 蓝 */
  --color-afternoon: #30D158;          /* 下午 · 绿 */
  --color-evening: #AF52DE;            /* 晚上 · 紫 */
  --color-text: #1D1D1F;               /* 主文字（macOS 近黑） */
  --color-text-secondary: #6E6E73;     /* 次级文字 */
  --color-text-tertiary: #8E8E93;      /* 弱化文字 */
  --color-bg: #F2F2F7;                 /* 页面背景（iOS 系统浅灰） */
  --color-surface: #FFFFFF;            /* 卡片面 */
  --color-border: rgba(0, 0, 0, .08);  /* 发丝分隔线 */
  --color-success: #34C759;            /* 系统绿 */
  --color-warn: #FF9F0A;               /* 系统橙 */

  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;

  --text-2xl: 20px;
  --text-xl: 17px;
  --text-base: 15px;
  --text-sm: 13px;
  --text-xs: 12px;

  --radius-lg: 18px;
  --radius-md: 14px;
  --radius-sm: 10px;

  --shadow-card: 0 1px 2px rgba(0, 0, 0, .05), 0 8px 24px rgba(0, 0, 0, .07);
  --shadow-card-hover: 0 4px 8px rgba(0, 0, 0, .06), 0 18px 44px rgba(0, 0, 0, .12);
}

/* ============ 基础 ============ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: 1.55;
  letter-spacing: -0.01em;
  color: var(--color-text);
  background: var(--color-bg);
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
a { color: inherit; text-decoration: none; }
* { -webkit-tap-highlight-color: transparent; }

.app {
  max-width: 1080px;
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 0px) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ============ 顶部标题栏 ============ */
.app-header {
  position: sticky; top: 0; z-index: 20;
  background: rgba(242, 242, 247, .8);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--color-border);
}
.header-inner {
  max-width: 1080px; margin: 0 auto;
  padding: 8px 16px 2px;
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
}
.header-title {
  font-size: var(--text-2xl); font-weight: 700; color: var(--color-text);
  letter-spacing: .2px;
}
.header-sub { font-size: var(--text-sm); color: var(--color-text-secondary); font-weight: 400; white-space: nowrap; }

/* ============ 周选择器 ============ */
.week-bar {
  max-width: 1080px; margin: 0 auto;
  padding: 2px 16px 8px;
  display: flex; align-items: center; gap: 10px;
}

/* 周切换一体控件：上一周 | 第X周 · 日期（可点开周面板）| 下一周，
   同一圆角表面内用发丝线分隔；高度与右侧“工作日/整周”分段控件一致 */
.week-stepper {
  flex: 1 1 auto; min-width: 0;
  display: flex; align-items: stretch;
  height: 45px;
  border-radius: 14px;
  background: var(--color-surface);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 2px 6px rgba(0, 0, 0, .06);
  overflow: hidden;
}
.ws-side {
  flex: 0 0 46px;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: 0; cursor: pointer;
  color: var(--color-text-secondary);
  -webkit-tap-highlight-color: transparent;
  transition: background .15s, color .15s, opacity .15s;
}
.ws-side:first-child { border-right: 1px solid var(--color-border); }
.ws-side:last-child  { border-left: 1px solid var(--color-border); }
.ws-side:active { background: rgba(0, 0, 0, .05); }
.ws-side:disabled { opacity: .3; cursor: default; }
.ws-side:disabled:active { background: transparent; }
.ws-side svg { width: 22px; height: 22px; }
.ws-main {
  position: relative;
  flex: 1 1 auto; min-width: 0;
  background: transparent; border: 0; cursor: pointer;
  color: var(--color-text);
  font-family: inherit;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  transition: background .15s;
}
.ws-main:active { background: rgba(0, 0, 0, .03); }
/* 三元素分别固定在 左 / 中 / 右，互不影响、不再随内容长度挤动 */
.ws-main #weekLabelMain {
  position: absolute; left: 16px; top: 50%;
  transform: translateY(-50%);
  width: 82px; text-align: right;      /* 固定宽区右对齐 → 右边缘恒定（16+82=98） */
  font-size: 17px; font-weight: 700; line-height: 1.2;
  letter-spacing: .4px; white-space: nowrap;
}
.ws-main .week-dates {
  position: absolute; left: 120px; top: 50%;      /* 98(标签右缘) + 22(恒定间隔) */
  transform: translateY(-50%);
  max-width: max(44px, calc(100% - 168px));   /* 预留右侧 ⇄ 图标区，并保证至少可见一段 */
  overflow: hidden; white-space: nowrap; text-align: left;
  font-size: 12.5px; font-weight: 500; line-height: 1.2;
  color: var(--color-text-tertiary); opacity: .9;
  font-variant-numeric: tabular-nums;
}
.ws-main .chevron {
  position: absolute; right: 18px; top: 50%;
  transform: translateY(-50%);
  width: 20px; height: 20px;
  color: var(--color-text-tertiary);
  opacity: .85;
  transition: color .2s;
}
.ws-main.open .chevron { color: var(--color-primary); }

/* 视图范围分段控件：iOS 风格，放在最右侧与主控件视觉区分 */
.seg {
  flex: 0 0 auto;
  display: inline-flex;
  background: var(--color-surface);
  border-radius: 14px;
  padding: 3px;
  gap: 3px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 2px 6px rgba(0, 0, 0, .06);
}
.seg-btn {
  border: 0; cursor: pointer; font-family: inherit;
  height: 39px; padding: 0 18px;
  border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600;
  color: var(--color-text-secondary);
  background: transparent;
  -webkit-tap-highlight-color: transparent;
  transition: color .18s, background .18s, box-shadow .18s;
}
.seg-btn:active { opacity: .7; }
.seg-btn.active {
  background: rgba(0, 122, 255, .12);
  color: var(--color-primary);
}
/* 顶部选择器放大后的窄屏适配：大字号/大标签区在窄屏会把日期挤爆，
   故 ≤560px 用紧凑几何（更小字号、更窄标签区），把空间让给日期范围，
   保证任意教学周完整显示不被裁剪——各固定区间隔仍恒定（标签右缘 8+54=62，日期起点 70 → 间隔 8）。
   高度与主控件一致保持 45px（stepper / seg 同步）。 */
@media (max-width: 560px) {
  .week-bar { padding: 2px 10px 10px; }
  .ws-side { flex-basis: 30px; }
  .ws-side svg { width: 18px; height: 18px; }
  .ws-main #weekLabelMain { left: 8px; width: 54px; font-size: 13px; letter-spacing: .2px; }
  .ws-main .week-dates { left: 70px; font-size: 9.5px; max-width: max(30px, calc(100% - 100px)); }
  .ws-main .chevron { right: 8px; width: 16px; height: 16px; }
  .seg-btn { height: 39px; padding: 0 10px; font-size: 11px; }
}

/* 返回本周按钮：位于周选择面板顶部，远离箭头避免误触 */
.week-today-btn {
  width: max-content; height: 34px; padding: 0 16px;
  border-radius: 999px;
  font-size: var(--text-xs); font-weight: 600;
  color: var(--color-text);
  background: var(--color-bg);
  display: none; align-items: center; justify-content: center; gap: 6px;
  margin: 0 auto 10px;
  transition: transform .15s ease-out, background .2s;
}
.week-today-btn:active { transform: scale(.97); }
.week-today-btn svg { width: 14px; height: 14px; }
.week-today-btn.visible { display: flex; }

/* 周选择面板 */
.week-picker {
  max-width: 1080px; margin: 0 auto;
  padding: 0 16px 10px;
  display: none;
}
.week-picker.open { display: block; animation: fadeDown .18s ease-out; }
@keyframes fadeDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.week-picker-inner {
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  padding: 14px;
  box-shadow: var(--shadow-card);
}
.week-picker-title { font-size: var(--text-xs); color: var(--color-text-tertiary); margin-bottom: 8px; font-weight: 600; }
.week-grid-pick {
  display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px;
}
.week-pick-btn {
  height: 40px; border-radius: 12px;
  font-size: var(--text-sm); font-weight: 600;
  color: var(--color-text-secondary);
  background: var(--color-bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.25;
  transition: transform .12s ease-out, background .15s, color .15s;
}
.week-pick-btn small { font-size: 10px; font-weight: 400; opacity: .65; }
.week-pick-btn:active { transform: scale(.94); }
.week-pick-btn[aria-pressed="true"] {
  background: var(--color-primary);
  color: #fff;
  font-weight: 700;
  box-shadow: 0 2px 8px rgba(0, 122, 255, .35);
}
.week-pick-btn.no-course { opacity: .45; }
.week-pick-btn:focus-visible {
  outline: 2px solid var(--color-primary); outline-offset: 2px;
}
.week-pick-btn { position: relative; }
/* 右上角橙点 = 该周周末有安排（补课/周末课） */
.week-pick-btn .wk-dot {
  position: absolute; top: 4px; right: 5px;
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--color-warn);
}

/* ============ 主内容 ============ */
main { padding: 4px 16px 40px; max-width: 1080px; margin: 0 auto; }

/* 周末安排提示条：仅工作日视图下、本周周末仍有补课/课时显示 */
.week-note {
  display: flex; align-items: center; gap: 8px;
  margin: 7px 0 12px;   /* 上下间距一致：上方距控制条 12、下方距课表 12 */
  padding: 8px 10px 8px 12px;
  border-radius: var(--radius-md);
  background: rgba(255, 159, 10, .12);
  color: var(--color-text-secondary);
  font-size: var(--text-xs); font-weight: 600;
}
.week-note svg { width: 15px; height: 15px; flex: 0 0 auto; color: var(--color-warn); }
.week-note-act {
  margin-left: auto; flex: 0 0 auto;
  height: 26px; padding: 0 11px; border-radius: 999px;
  color: #fff; background: var(--color-warn);
  font-size: var(--text-xs); font-weight: 700;
  transition: transform .12s ease-out, opacity .15s;
}
.week-note-act:active { transform: scale(.94); }

.week-empty-banner {
  background: var(--color-surface);
  border: 1px dashed var(--color-border);
  border-radius: var(--radius-md);
  padding: 22px 16px;
  text-align: center;
  font-size: var(--text-sm); color: var(--color-text-tertiary);
  margin-bottom: 16px;
}
.week-empty-banner svg { width: 26px; height: 26px; opacity: .5; margin-bottom: 6px; }

/* ============ 周视图：时间轴课表 ============ */
/* 左侧为时间轴列，右侧周一~周日 7 列；表头一行 + 轨道一行，
   课程按上课时段绝对定位，块高度 = 课时在一天中的占比 */
/* 周六/周日目前无课，默认显示"无课"；数据里补上周末课程后会自动显示 */
/* 结构：固定左栏（时间轴）+ 右侧可横向滚动的课表区 */
.week-view {
  --track-h: 400px;
  display: flex;
  align-items: stretch;
}

/* 固定左栏：时间轴（含左上角"时间"格），不随课表滚动 */
.week-side {
  flex: 0 0 34px;
  display: flex;
  flex-direction: column;
}

/* 右侧可滚动区：仅装周一~周日的日期表头与轨道 */
.week-scroll {
  flex: 1 1 auto;
  min-width: 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.week-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  grid-template-rows: 60px var(--track-h);
  column-gap: 6px;
  row-gap: 0;
  align-items: stretch;
  min-width: 665px;
  padding: 0 2px 12px 0;
}
/* 仅工作日视图：5 列（周一~周五） */
.week-grid.cols-5 {
  grid-template-columns: repeat(5, minmax(0, 1fr));
  min-width: 475px;
}

@media (max-width: 620px) {
  .week-view { margin-left: -16px; }
}

/* 左上角：时间轴表头（固定左栏顶部，与日期表头对齐） */
.axis-head {
  flex: 0 0 60px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; color: var(--color-text-tertiary);
}

/* 日期表头（周一~周日） */
.day-head {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px;
  height: 60px;
  padding: 2px 4px;
  overflow: hidden;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md) var(--radius-md) 0 0;
}
.day-head.is-today {
  border-color: rgba(52, 199, 89, .55);
  background: linear-gradient(180deg, rgba(0, 122, 255, .07), var(--color-surface));
}
.day-name { font-size: 12px; font-weight: 700; line-height: 1.2; color: var(--color-text); white-space: nowrap; }
.day-date { font-size: 10px; line-height: 1.2; color: var(--color-text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 补课列标识：列头右上角一个"补"字小三角旗标（Apple 风格，避免多余胶囊/描边） */
.mk-corner {
  position: absolute; top: 0; right: 0;
  width: 28px; height: 28px;
  clip-path: polygon(0 0, 100% 0, 100% 100%);
  background: var(--color-warn);
  color: #fff;
  font-size: 9px; font-weight: 700; line-height: 1;
  display: flex; align-items: flex-start; justify-content: flex-end;
  padding: 5px 4px 0 0;
  pointer-events: none; user-select: none;
}

/* 左侧时间轴（与轨道同高，刻度按时间百分比定位） */
.time-axis {
  position: relative;
  flex: 1 1 auto;
}
.axis-mark {
  position: absolute; left: 0; right: 0; transform: translateY(-50%);
  text-align: center;
  font-size: 9px; line-height: 1; color: var(--color-text-tertiary);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}

/* 每日轨道：相对定位容器 */
.day-track {
  position: relative;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-top: none;
  border-radius: 0 0 var(--radius-md) var(--radius-md);
  overflow: hidden;
}
.day-track.is-today {
  border-color: rgba(52, 199, 89, .55);
  box-shadow: inset 0 0 0 1px rgba(52, 199, 89, .25);
}

/* 空周末列弱化：极轻的灰面卡片 + 淡发丝边，安静不抢眼 */
.day-head.weekend-muted .day-date { color: var(--color-text-tertiary); }
.day-track.weekend-muted {
  background: rgba(255, 255, 255, .55);
  border-color: rgba(0, 0, 0, .05);
}
.day-track.weekend-muted .day-empty {
  color: var(--color-text-tertiary);
  opacity: .6;
  font-weight: 500;
}

/* 课程块：按 top%/height% 定位，高度对应课时占比 */
.course-block {
  position: absolute; left: 2px; right: 2px;
  border-radius: 10px;
  border: 1px solid rgba(0, 0, 0, .05);
  padding: 3px 5px;
  display: flex; flex-direction: column; gap: 2px;
  overflow: hidden;
  background: var(--color-surface);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .04);
}
.course-block.morning   { background: rgba(10, 132, 255, .05); }
.course-block.afternoon { background: rgba(52, 199, 89, .05); }
.course-block.evening   { background: rgba(175, 82, 222, .05); }
.course-block::before {
  content: ""; position: absolute; left: 0; top: 4px; bottom: 4px;
  width: 3px; border-radius: 0 2px 2px 0;
}
.course-block.morning::before   { background: var(--color-morning); }
.course-block.afternoon::before { background: var(--color-afternoon); }
.course-block.evening::before   { background: var(--color-evening); }
.cb-time {
  font-size: 9px; color: var(--color-text-tertiary); line-height: 1.1;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.cb-name {
  font-size: 11px; font-weight: 600; line-height: 1.3;
  overflow-wrap: anywhere;
}
.cb-teacher, .cb-location {
  font-size: 10px; color: var(--color-text-secondary); line-height: 1.2;
  overflow-wrap: anywhere;
}

/* 全天无课 / 节假日放假 */
.day-empty {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: var(--text-xs); color: var(--color-text-tertiary);
}

/* ============ 备注折叠区 ============ */
.notes { margin-top: 28px; }
.notes-title {
  font-size: var(--text-base); font-weight: 700;
  color: var(--color-text-secondary);
  margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
}
.notes-title svg { width: 16px; height: 16px; opacity: .8; }
.note-panel {
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  margin-bottom: 12px;
  box-shadow: var(--shadow-card);
  overflow: hidden;
}
.note-summary {
  display: flex; align-items: center; justify-content: space-between;
  height: 52px; padding: 0 16px;
  font-size: var(--text-base); font-weight: 600;
  cursor: pointer;
  list-style: none;
}
.note-summary::-webkit-details-marker { display: none; }
.note-summary .note-icon { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.note-summary .note-icon svg { width: 18px; height: 18px; flex: 0 0 auto; opacity: .7; }
.note-summary .chevron {
  width: 18px; height: 18px; opacity: .6;
  transition: transform .25s ease-out;
}
details[open] .note-summary .chevron { transform: rotate(180deg); }
.note-body { padding: 0 16px 14px; }
.note-body ul { list-style: none; }
.note-body li {
  position: relative; padding: 6px 0 6px 14px;
  font-size: var(--text-sm); color: var(--color-text-secondary);
  line-height: 1.7;
}
.note-body li::before {
  content: ""; position: absolute; left: 0; top: 14px;
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--color-text-tertiary);
}
.note-body li.adjust::before { background: var(--color-warn); }

.hidden { display: none !important; }

/* ============ 课程详情弹窗 ============ */
.course-block { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.course-block:hover { border-color: rgba(0, 0, 0, .1); }
.modal-mask {
  position: fixed; inset: 0; z-index: 1300;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background: rgba(12, 12, 16, .42);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity .2s ease-out, visibility .2s ease-out;
}
.modal-mask.show { opacity: 1; visibility: visible; pointer-events: auto; }
body.modal-open { overflow: hidden; }
.modal-card {
  position: relative;   /* 让右上角 ✕ 等绝对定位子元素始终以卡片为基准 */
  width: min(100%, 400px);
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  padding: 20px 22px 22px;
  box-shadow: 0 18px 60px rgba(0, 0, 0, .28);
  transform: translateY(14px) scale(.98);
  transition: transform .22s cubic-bezier(.2, .8, .25, 1);
}
.modal-mask.show .modal-card { transform: none; }
.modal-close {
  position: absolute; top: 10px; right: 10px;
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--color-text-secondary);
  background: rgba(0, 0, 0, .05);
  transition: background .15s;
}
.modal-close:active { background: rgba(0, 0, 0, .12); }
.cm-head { display: flex; align-items: center; gap: 8px; min-height: 20px; margin-bottom: 6px; }
.cm-meta { font-size: var(--text-sm); color: var(--color-text-tertiary); font-weight: 500; }
.cm-mk {
  font-size: 10px; font-weight: 700; color: #fff; background: var(--color-warn);
  border-radius: 999px; padding: 2px 9px; letter-spacing: .2px;
}
.cm-name { font-size: 20px; font-weight: 700; line-height: 1.35; color: var(--color-text); }
.cm-rows { margin-top: 12px; }
.cm-row {
  display: flex; align-items: baseline; gap: 14px;
  padding: 12px 0; border-top: 1px solid var(--color-border);
}
.cm-row dt {
  flex: 0 0 60px; font-size: var(--text-sm);
  color: var(--color-text-tertiary);
}
.cm-row dd {
  flex: 1; font-size: var(--text-sm); font-weight: 600; color: var(--color-text);
  line-height: 1.5; overflow-wrap: anywhere;
}

/* ============ 底部入口：原始课程表（与备注卡片同款） ============ */
.sheet-entry { margin-top: 0; }
.sheet-entry-btn {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; height: 52px; padding: 0 16px;
  background: var(--color-surface);
  border: none; border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  color: var(--color-text); text-align: left; cursor: pointer;
  font: inherit; font-size: var(--text-base); font-weight: 600;
  transition: box-shadow .18s ease-out;
  -webkit-tap-highlight-color: transparent;
}
.sheet-entry-btn:active { box-shadow: var(--shadow-card-hover); }
.sheet-entry-btn .sheet-entry-ico {
  display: inline-flex; align-items: center; gap: 8px; min-width: 0;
}
.sheet-entry-btn .sheet-entry-ico svg {
  width: 18px; height: 18px; flex: 0 0 auto; opacity: .7;
}
.sheet-entry-btn > svg {
  width: 18px; height: 18px; flex: 0 0 auto; margin-left: 8px; opacity: .6;
}

/* ============ 原表弹层（整份 Excel 课程表） ============ */
.modal-card--sheet {
  width: min(100%, 700px);
  max-height: min(86vh, 780px);
  padding: 0; overflow: hidden;
  display: flex; flex-direction: column; align-items: stretch;
}
.sheet-head {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 10px;
  padding: 13px 10px 12px 18px;
  border-bottom: 1px solid var(--color-border);
}
.sheet-title {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 8px;
  font-size: 17px; font-weight: 700; color: var(--color-text);
}
.sheet-title svg { flex: 0 0 auto; width: 18px; height: 18px; opacity: .7; }
.sheet-close { position: static; margin: 0; flex: 0 0 auto; }
.sheet-scroll {
  flex: 1 1 auto; min-height: 0;
  padding: 8px 18px 22px;
  overflow: auto; -webkit-overflow-scrolling: touch;
}
/* 原表图片：默认适配宽度（看整体），点一下切到原始像素宽（看小字），可上下左右拖动 */
.os-zoom {
  display: block; width: 100%; margin: 0; padding: 0;
  background: none; border: none; cursor: zoom-in;
  -webkit-tap-highlight-color: transparent;
}
.os-zoom:active .os-img { opacity: .9; }
.os-zoom.zoomed { cursor: zoom-out; width: auto; }
.os-img {
  display: block; width: 100%; height: auto;
  background: #fff;
  border: 1px solid var(--color-border);
  border-radius: 10px;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .05);
  image-rendering: -webkit-optimize-contrast;
}
.os-zoom.zoomed .os-img { border-color: transparent; border-radius: 0; box-shadow: none; }
.sheet-scroll.zoomed { padding: 0; }
.os-hint {
  margin: 10px 2px 0;
  font-size: var(--text-xs); color: var(--color-text-tertiary);
  text-align: center; line-height: 1.6;
}
.sheet-scroll.zoomed .os-hint { display: none; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<div class="app">

  <!-- 标题栏 -->
  <header class="app-header">
    <div class="header-inner">
      <h1 class="header-title" id="headerTitle">MBA课表</h1>
      <span class="header-sub" id="headerSub"></span>
    </div>

    <!-- 周切换一体控件（上一周 | 第X周·日期 | 下一周）+ 视图范围分段（同一行，分段靠右） -->
    <div class="week-bar">
      <div class="week-stepper" role="group" aria-label="切换教学周">
        <button class="ws-side" id="prevWeek" type="button" aria-label="上一周">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="ws-main" id="weekLabel" type="button" aria-haspopup="true" aria-expanded="false">
          <span id="weekLabelMain">第 1 周</span>
          <span class="week-dates" id="weekLabelDates"></span>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
        </button>
        <button class="ws-side" id="nextWeek" type="button" aria-label="下一周">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <div class="seg" role="group" aria-label="课表视图范围">
        <button class="seg-btn" id="scopeWork" type="button" aria-pressed="false" title="只显示工作日（周一~五）">工作日</button>
        <button class="seg-btn active" id="scopeAll" type="button" aria-pressed="true" title="显示完整周（周一~日）">整周</button>
      </div>
    </div>

    <!-- 周选择面板 -->
    <div class="week-picker" id="weekPicker">
      <div class="week-picker-inner">
        <button class="week-today-btn" id="weekTodayBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="6" x2="12" y2="12" x3="16" y3="14"/></svg>
          回到本周
        </button>
        <div class="week-picker-title">选择教学周（灰字 = 本周无课；右上角橙点 = 周末有安排）</div>
        <div class="week-grid-pick" id="weekGridPick"></div>
      </div>
    </div>
  </header>

  <!-- 内容 -->
  <main>
    <!-- 仅工作日视图下、本周周末仍有安排的提示条 -->
    <div class="week-note hidden" id="weekNote" role="status">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
      <span id="weekNoteText"></span>
      <button type="button" class="week-note-act" id="weekNoteAct">查看整周</button>
    </div>
    <div class="week-empty-banner hidden" id="weekEmptyBanner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="12" y2="17"/></svg>
      <div>本周暂无课程安排</div>
    </div>

    <!-- 整周视图 -->
    <section class="week-view" id="weekView" aria-label="本周课表"></section>

    <!-- 备注 -->
    <section class="notes" aria-label="备注">
      <h2 class="notes-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        备注与说明
      </h2>
      <details class="note-panel">
        <summary class="note-summary" id="noteAdjustSummary">
          <span class="note-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            调课说明
          </span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </summary>
        <div class="note-body"><ul id="noteAdjustList"></ul></div>
      </details>
      <details class="note-panel">
        <summary class="note-summary" id="noteArrangeSummary">
          <span class="note-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            入学安排与上课说明
          </span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </summary>
        <div class="note-body"><ul id="noteArrangeList"></ul></div>
      </details>
    </section>

    <!-- 原始课程表（原版图片）入口 -->
    <section class="sheet-entry" aria-label="原始课程表">
      <button type="button" class="sheet-entry-btn" id="origEntry">
        <span class="sheet-entry-ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/></svg>

        </span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
      </button>
    </section>

  </main>

</div>

<!-- 课程详情弹窗（遮罩 + 居中卡片） -->
<div class="modal-mask" id="courseModal" role="dialog" aria-modal="true" aria-label="课程详情">

</div>

<script>
(function () {
  "use strict";
  var D = window.SCHEDULE_DATA;

  /* ---------- 教学周参数 ---------- */
  var TOTAL_WEEKS = 20;                       // 校历共 20 个教学周（2026-09-07 ~ 2027-01-24），课程自第 2 周起
  var TERM_START = new Date(2026, 8, 6);      // 2026-09-06（周日），第 1 周起点
  // 首个教学周一 = TERM_START(周日 9/6) + 1 天 = 2026-09-07。
  // 真实"当前周"与展示窗口统一按该周一锚点（周一~周日）计周，避免周日定位偏差。
  var TERM_MONDAY = new Date(TERM_START.getTime() + 1 * 86400000);

  // 一天时间轴刻度：08:00（第480分钟）~ 21:30（第1290分钟）
  var DAY_START = 480;
  var DAY_END = 1290;
  var DAY_TOTAL = DAY_END - DAY_START;

  var periodMeta = {
    morning:   { label: "上午",  time: "8:30-11:50", className: "morning",   start: 510,  end: 710 },
    afternoon: { label: "下午",  time: "14:00-17:10", className: "afternoon", start: 840,  end: 1030 },
    evening:   { label: "晚上",  time: "18:30-21:00", className: "evening",  start: 1110, end: 1260 }
  };

  // 法定节假日（2026-2027 第一学期；仅周一~周五放假当天无课）
  var HOLIDAYS = {
    "2026-9-25": "中秋节",
    "2026-10-1": "国庆节",
    "2026-10-2": "国庆节",
    "2026-10-5": "国庆节",
    "2026-10-6": "国庆节",
    "2026-10-7": "国庆节",
    "2027-1-1": "元旦"
  };
  function holidayOf(d) {
    return HOLIDAYS[d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate()] || null;
  }

  // 调休补课：周末补上某平日（周一~周五）的课。key 与 holidayOf 同格式；
  // borrow = 被补的平日名；makeupWeek = 该课对应的（被补的）教学周，用于按开课周过滤。
  var MAKEUPS = {
    "2026-9-20":  { borrow: "周二", makeupWeek: 5 },  // 补 10/6（第5周 周二，国庆假内）
    "2026-10-10": { borrow: "周三", makeupWeek: 5 }   // 补 10/7（第5周 周三，国庆假内）
  };
  function makeupOf(d) {
    return MAKEUPS[d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate()] || null;
  }
  // 按平日名取 D.days 索引（0=周一 … 6=周日）；找不到返回 -1
  function dayIndexByName(name) {
    for (var i = 0; i < D.days.length; i++) if (D.days[i].name === name) return i;
    return -1;
  }

  var currentWeek = defaultWeek();
  var followToday = true;   // 跟随"真实当前周"：刷新自动定位；手动切周后暂停，返回本周恢复
  // 视图范围：true = 含周末(周一~周日)，false = 仅工作日(周一~周五)
  // SMART_DEFAULT=true：首载自动选择——真实周周末有安排→完整周，否则→仅工作日；手动切换后记住本次选择。
  // 想回到“永远默认完整周”，把下面改为 false 即可。
  var SMART_DEFAULT = true;
  var scopeUserChanged = false;
  var showWeekends = true;

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    headerTitle: $("headerTitle"), headerSub: $("headerSub"),
    weekLabel: $("weekLabel"), weekLabelMain: $("weekLabelMain"), weekLabelDates: $("weekLabelDates"),
    weekPicker: $("weekPicker"), weekGridPick: $("weekGridPick"),
    prevWeek: $("prevWeek"), nextWeek: $("nextWeek"), weekTodayBtn: $("weekTodayBtn"),
    scopeWork: $("scopeWork"), scopeAll: $("scopeAll"),
    weekNote: $("weekNote"), weekNoteText: $("weekNoteText"), weekNoteAct: $("weekNoteAct"),
    weekView: $("weekView"), weekEmptyBanner: $("weekEmptyBanner"),
    noteAdjustList: $("noteAdjustList"), noteArrangeList: $("noteArrangeList"),
    origEntry: $("origEntry")
  };

  /* ---------- 工具 ---------- */
  function weekOfDate(d) {
    var diff = Math.floor((d.getTime() - TERM_MONDAY.getTime()) / 86400000);
    var wk = Math.floor(diff / 7) + 1;
    return Math.min(Math.max(wk, 1), TOTAL_WEEKS);
  }

  function defaultWeek() {
    return weekOfDate(new Date());
  }

  function weekDates(w) {
    // 返回该周周一 ~ 周日的 Date 数组（第 w 周：周一 = TERM_MONDAY + (w-1)*7 天）
    var monday = new Date(TERM_MONDAY.getTime() + (w - 1) * 7 * 86400000);
    var arr = [];
    for (var i = 0; i < 7; i++) arr.push(new Date(monday.getTime() + i * 86400000));
    return arr;
  }

  function fmtDate(d) {
    return (d.getMonth() + 1) + "月" + d.getDate() + "日";
  }

  function fmtRange(w) {
    // 紧凑格式（如 9/21-9/27），配合下方灰字显示日期范围
    var dates = weekDates(w);
    var a = dates[0], b = dates[showWeekends ? 6 : 4];
    return (a.getMonth() + 1) + "/" + a.getDate() + " - " + (b.getMonth() + 1) + "/" + b.getDate();
  }

  // 该周是否含调休补课
  function weekHasMakeup(w) {
    var ds = weekDates(w);
    for (var i = 0; i < ds.length; i++) if (makeupOf(ds[i])) return true;
    return false;
  }

  // 该周周末（六/日）是否有安排：补课，或数据里排的周末课程
  function weekendHasArrangement(w) {
    if (weekHasMakeup(w)) return true;
    var ds = weekDates(w);
    if (ds.length < 7) return false;
    for (var i = 5; i < ds.length; i++) {
      var day = D.days[i];
      for (var pi = 0; pi < D.periods.length; pi++) {
        var list = day.courses[D.periods[pi].id] || [];
        for (var cj = 0; cj < list.length; cj++) {
          if (courseInWeek(list[cj], w)) return true;
        }
      }
    }
    return false;
  }

  // 视图列数：含周末 = 7；仅工作日 = 5
  function visibleCols() {
    return showWeekends ? 7 : 5;
  }

  function parseWeeks(nature) {
    // "2-9周" → [2,9]；"从第二周开始" → [2, TOTAL]；无 → [1, TOTAL]
    if (!nature) return [1, TOTAL_WEEKS];
    var m = nature.match(/(\d+)\s*[-—~至]\s*(\d+)\s*周/);
    if (m) return [parseInt(m[1], 10), parseInt(m[2], 10)];
    m = nature.match(/从第?([一二三四五六七八九十\d]+)周/);
    if (m) {
      var cn = m[1];
      var num = "一二三四五六七八九".indexOf(cn) + 1;
      if (cn === "十") num = 10;
      if (/^\d+$/.test(cn)) num = parseInt(cn, 10);
      if (num >= 1) return [num, TOTAL_WEEKS];
    }
    return [1, TOTAL_WEEKS];
  }

  function courseInWeek(c, w) {
    var r = parseWeeks(c.nature);
    return w >= r[0] && w <= r[1];
  }

  function weekHasCourse(w) {
    for (var i = 0; i < D.days.length; i++) {
      for (var pid in periodMeta) {
        var list = D.days[i].courses[pid] || [];
        for (var j = 0; j < list.length; j++) {
          if (courseInWeek(list[j], w)) return true;
        }
      }
    }
    return false;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function sameDate(a, b) {
    return a.getFullYear() === b.getFullYear() &&
           a.getMonth() === b.getMonth() &&
           a.getDate() === b.getDate();
  }

  // 在给定的一周日期数组中返回"今天"的列索引（含周六/周日）；不在该周返回 -1
  function todayIndexIn(dates) {
    var now = new Date();
    for (var i = 0; i < dates.length; i++) {
      if (sameDate(dates[i], now)) return i;
    }
    return -1;
  }

  function isCurrentWeek() {
    return weekOfDate(new Date()) === currentWeek;
  }

  /* 将"今天"所在列滚动到可视范围内（仅当前为真实周且今天在该周网格里时；含周六/周日） */
  function scrollToToday() {
    if (!isCurrentWeek()) return;
    var t = todayIndexIn(weekDates(currentWeek));
    if (t < 0) return;
    var el = document.getElementById("day-" + t);
    if (el && el.scrollIntoView) {
      try { el.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" }); } catch (e) {}
    }
  }

  /* 轻量时钟：每分钟检查一次日期；
     ① 跨周（跟随模式下）→ 自动定位到新周
     ② 同周跨天 → 自动刷新"今天"高亮并滚动到新今天列
     手动切到其他周时保持不动，尊重用户选择 */
  function dayKey(d) {
    return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
  }
  var lastDayKey = dayKey(new Date());

  function initClock() {
    setInterval(function () {
      var now = new Date();
      var k = dayKey(now);
      if (k === lastDayKey) return;   // 日期未变，跳过
      lastDayKey = k;
      var w = defaultWeek();
      var viewIsRealWeek = (w === currentWeek);
      if (viewIsRealWeek || followToday) {
        currentWeek = w;
        refresh();
        setTimeout(scrollToToday, 80);
      }
      // 手动看其他周（非跟随）→ 保持不动
    }, 60000);
  }

  /* ---------- 渲染：周选择器 ---------- */
  function renderWeekBar() {
    els.weekLabelMain.textContent = "第 " + currentWeek + " 周";
    els.weekLabelDates.textContent = fmtRange(currentWeek);
    els.prevWeek.disabled = currentWeek <= 1;
    els.nextWeek.disabled = currentWeek >= TOTAL_WEEKS;
    // 是否显示"返回本周"（只要当前不在真实周就显示，开学前也允许）
    if (defaultWeek() !== currentWeek) {
      els.weekTodayBtn.classList.add("visible");
    } else {
      els.weekTodayBtn.classList.remove("visible");
    }
    // 视图范围分段控件高亮
    var on = showWeekends;
    els.scopeWork.setAttribute("aria-pressed", on ? "false" : "true");
    els.scopeAll.setAttribute("aria-pressed", on ? "true" : "false");
    els.scopeWork.classList.toggle("active", !on);
    els.scopeAll.classList.toggle("active", on);
  }

  function renderWeekPicker() {
    var html = "";
    for (var w = 1; w <= TOTAL_WEEKS; w++) {
      var has = weekHasCourse(w);
      var pressed = w === currentWeek ? ' aria-pressed="true"' : "";
      var noCls = has ? "" : " no-course";
      var wknd = weekendHasArrangement(w);
      var mkCls = wknd ? " has-mk" : "";
      var dates = weekDates(w);
      var label = "第" + w + "周";
      var sub = (dates[0].getMonth() + 1) + "/" + dates[0].getDate();
      html += '<button class="week-pick-btn' + noCls + mkCls + '" data-week="' + w + '"' + pressed +
        (wknd ? ' title="本周周末有安排"' : "") + '>' +
        label + "<small>" + sub + "</small>" + (wknd ? '<i class="wk-dot" aria-hidden="true"></i>' : "") +
        "</button>";
    }
    els.weekGridPick.innerHTML = html;
    els.weekGridPick.querySelectorAll(".week-pick-btn").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        currentWeek = parseInt(btn.dataset.week, 10);
        followToday = false;
        refresh();
      });
    });
  }

  function openPicker() {
    renderWeekPicker();
    els.weekPicker.classList.add("open");
    els.weekLabel.classList.add("open");
    els.weekLabel.setAttribute("aria-expanded", "true");
    // 打开后尽量让当前周按钮可见（不在可视区时才轻微滚动）
    var cur = els.weekGridPick.querySelector('[aria-pressed="true"]');
    if (cur && cur.scrollIntoView) {
      try { cur.scrollIntoView({ block: "nearest" }); } catch (e) {}
    }
  }
  function closePicker() {
    els.weekPicker.classList.remove("open");
    els.weekLabel.classList.remove("open");
    els.weekLabel.setAttribute("aria-expanded", "false");
  }

  /* ---------- 渲染：整周视图（时间轴课表） ---------- */
  function renderWeekView() {
    var allDates = weekDates(currentWeek);
    var n = visibleCols();                       // 7（含周末）或 5（仅工作日）
    var dates = allDates.slice(0, n);
    var tIdx = todayIndexIn(allDates);           // 今天在本周内的列索引（含周六/周日），不在则 -1
    var anyCourse = false;
    var side = "", heads = "", tracks = "";

    function pct(mins) { return (mins - DAY_START) / DAY_TOTAL * 100; }

    // 固定左栏：左上角"时间"格 + 每小时整点刻度
    side += '<div class="axis-head">时间</div>';
    side += '<div class="time-axis" aria-hidden="true">';
    for (var h = 8; h <= 21; h++) {
      side += '<span class="axis-mark" style="top:calc(' + pct(h * 60).toFixed(3) + '% + 5px)">' + h + ":00</span>";
    }
    side += "</div>";

    // 预计算每列信息（表头/轨道共用，保证今天、补课、空周末弱化一致）
    var cols = [];
    for (var i = 0; i < n; i++) {
      var d = dates[i];
      var mk = makeupOf(d);
      var hasData = false;
      if (!mk) {
        var day = D.days[i];
        var pd, list, cj;
        outer:
        for (pd = 0; pd < D.periods.length; pd++) {
          list = day.courses[D.periods[pd].id] || [];
          for (cj = 0; cj < list.length; cj++) {
            if (courseInWeek(list[cj], currentWeek)) { hasData = true; break outer; }
          }
        }
      }
      cols.push({ day: D.days[i], d: d, mk: mk, muted: (i >= 5) && !mk && !hasData });
    }

    // 表头行：周几 + 日期；补课列在右上角加"补"三角旗标；无课的周末列表头弱化
    cols.forEach(function (c, i) {
      var isToday = (i === tIdx);
      heads += '<div class="day-head' + (isToday ? " is-today" : "") + (c.muted ? " weekend-muted" : "") + '">';
      heads += '<span class="day-name">' + c.day.name + "</span>";
      heads += '<time class="day-date" datetime="' + c.d.getFullYear() + "-" + (c.d.getMonth() + 1) + "-" + c.d.getDate() + '">' + fmtDate(c.d) + "</time>";
      if (c.mk) heads += '<span class="mk-corner" aria-hidden="true">补</span>';
      heads += "</div>";
    });

    // 轨道行：课程按时段定位；补课日借用被补平日的课（按被补周过滤开课周）；空周末弱化显示"休息"
    cols.forEach(function (c, i) {
      var isToday = (i === tIdx);
      var cls = isToday ? " is-today" : "";
      var hol = holidayOf(c.d);
      var dayHas = false;
      var track = '<div class="day-track' + cls + (c.muted ? " weekend-muted" : "") + '" id="day-' + i + '">';

      if (hol && !c.mk) {
        track += '<div class="day-empty">无课</div>';
      } else {
        var srcIdx = c.mk ? dayIndexByName(c.mk.borrow) : i;
        var src = D.days[srcIdx >= 0 ? srcIdx : i];
        var filterWeek = c.mk ? (c.mk.makeupWeek || currentWeek) : currentWeek;

        D.periods.forEach(function (p) {
          var meta = periodMeta[p.id];
          var courses = (src.courses[p.id] || []).filter(function (cr) { return courseInWeek(cr, filterWeek); });
          if (courses.length === 0) return; // 该时段无课则不显示
          dayHas = true;
          anyCourse = true;
          var top = pct(meta.start);
          var hgt = (meta.end - meta.start) / DAY_TOTAL * 100;
          courses.forEach(function (cr) {
            track += '<div class="course-block ' + meta.className + '" style="top:calc(' + top.toFixed(3) + '% + 5px);height:calc(' + hgt.toFixed(3) + '% - 5px)"' +
              ' data-name="' + escapeHtml(cr.name) + '"' +
              ' data-time="' + meta.time + '" data-slot="' + meta.label + '"' +
              ' data-teacher="' + escapeHtml(cr.teacher || "") + '"' +
              ' data-location="' + escapeHtml(cr.location || "") + '"' +
              ' data-week="' + c.day.name + '" data-date="' + fmtDate(c.d) + '"' +
              ' data-mk="' + escapeHtml(c.mk ? c.mk.borrow : "") + '">';
            track += '<div class="cb-time">' + meta.time + "</div>";
            track += '<div class="cb-name">' + escapeHtml(cr.name) + "</div>";
            if (cr.teacher) track += '<div class="cb-teacher">' + escapeHtml(cr.teacher) + "</div>";
            if (cr.location) track += '<div class="cb-location">' + escapeHtml(cr.location) + "</div>";
            track += "</div>";
          });
        });

        if (!dayHas) {
          track += '<div class="day-empty">' + (c.muted ? "休息" : "无课") + "</div>";
        }
      }
      track += "</div>";
      tracks += track;
    });

    // 结构：固定左栏（时间轴）+ 右侧可滚动区（日期表头 + 轨道）；仅工作日时为 5 列
    els.weekView.innerHTML = '<div class="week-side">' + side + '</div>' +
      '<div class="week-scroll"><div class="week-grid' + (n < 7 ? " cols-5" : "") + '">' + heads + tracks + '</div></div>';
    // 整周无课（含节假日）→ 隐藏课表，仅显示"本周暂无课程安排"
    els.weekView.classList.toggle("hidden", !anyCourse);
    els.weekEmptyBanner.classList.toggle("hidden", anyCourse);
  }

  /* ---------- 渲染：周末安排提示条 ---------- */
  /* 仅工作日视图 + 该周周末确有安排（补课/周末课）时显示，提醒可切回完整周查看 */
  function renderWeekNote() {
    if (showWeekends || !weekendHasArrangement(currentWeek)) {
      els.weekNote.classList.add("hidden");
      return;
    }
    var ds = weekDates(currentWeek);
    var parts = [];
    for (var i = 5; i < 7 && i < ds.length; i++) {
      var d = ds[i];
      var mk = makeupOf(d);
      if (mk) {
        parts.push(fmtDate(d) + "（" + D.days[i].name + "）补课");
      } else {
        var day = D.days[i], has = false, pi, list, cj;
        for (pi = 0; pi < D.periods.length && !has; pi++) {
          list = day.courses[D.periods[pi].id] || [];
          for (cj = 0; cj < list.length; cj++) {
            if (courseInWeek(list[cj], currentWeek)) { has = true; break; }
          }
        }
        if (has) parts.push(fmtDate(d) + "（" + D.days[i].name + "）有课");
      }
    }
    els.weekNoteText.textContent = "本周周末有安排：" + parts.join("、") + "。";
    els.weekNote.classList.remove("hidden");
  }

  /* ---------- 课程详情弹窗 ---------- */
  var courseModalCache = null;
  function courseModal() {
    if (!courseModalCache) {
      courseModalCache = {
        mask: $("courseModal"), close: $("courseModalClose"),
        meta: $("cmMeta"), mk: $("cmMk"), name: $("cmName"),
        time: $("cmTime"), teacher: $("cmTeacher"), location: $("cmLocation")
      };
    }
    return courseModalCache;
  }
  function openCourseModal(blk) {
    var d = blk.dataset, m = courseModal();
    m.name.textContent = d.name || "课程";
    m.time.textContent = (d.slot ? d.slot + " " : "") + (d.time || "");
    m.teacher.textContent = d.teacher || "—";
    m.location.textContent = d.location || "—";
    m.meta.textContent = (d.week || "") + (d.date ? " · " + d.date : "");
    if (d.mk) {
      m.mk.textContent = "调休 · 补 " + d.mk + " 的课";
      m.mk.classList.remove("hidden");
    } else {
      m.mk.classList.add("hidden");
    }
    m.mask.classList.add("show");
    document.body.classList.add("modal-open");
  }
  function closeCourseModal() {
    var m = courseModal();
    m.mask.classList.remove("show");
    document.body.classList.remove("modal-open");
  }

  /* ---------- 原始课程表（原版图片弹层） ---------- */
  var origModalCache = null;
  function origModal() {
    if (!origModalCache) {
      var body = $("origBody"), zoom = $("origZoom"), img = $("origImg");
      origModalCache = { mask: $("origModal"), close: $("origClose"), body: body, zoom: zoom, img: img };
      zoom.addEventListener("click", function () {
        setOrigZoom(!zoom.classList.contains("zoomed"));
      });
      // data URI 解码完成后补一次，避免首点落在未加载时被吞掉
      img.addEventListener("load", function () { if (origZoomOn) setOrigZoom(true); });
    }
    return origModalCache;
  }
  // 适配宽度 ⇄ 原始像素宽（放大后靠容器滚动看其余部分）
  var origZoomOn = false;
  function setOrigZoom(on) {
    var m = origModal();
    origZoomOn = on;
    m.zoom.classList.toggle("zoomed", on);
    m.body.classList.toggle("zoomed", on);
    if (on) {
      if (!m.img.naturalWidth) return;   // 尚未解码，load 后再定宽
      m.img.style.width = m.img.naturalWidth + "px";
      // 放大后从表格左上角开始，按周次/课程名称的自然顺序往右拖
      m.body.scrollTop = 0;
      m.body.scrollLeft = 0;
    } else {
      m.img.style.width = "";
      m.body.scrollTop = 0;
      m.body.scrollLeft = 0;
    }
  }
  function openOrigModal() {
    var m = origModal();
    if (!m.img.getAttribute("src")) m.img.setAttribute("src", window.ORIG_IMAGE || "");
    m.mask.classList.add("show");
    document.body.classList.add("modal-open");
  }
  function closeOrigModal() {
    var m = origModal();
    m.mask.classList.remove("show");
    document.body.classList.remove("modal-open");
    setOrigZoom(false);   // 下次打开回到适配宽度的总览态
  }

  /* ---------- 渲染：备注 ---------- */
  function renderNotes() {
    var a = "";
    (D.notes.adjust || []).forEach(function (t) { a += '<li class="adjust">' + escapeHtml(t) + "</li>"; });
    els.noteAdjustList.innerHTML = a;
    var b = "";
    (D.notes.arrange || []).forEach(function (t) { b += "<li>" + escapeHtml(t) + "</li>"; });
    els.noteArrangeList.innerHTML = b;
  }

  /* ---------- 头部 ---------- */
  function updateHeader() {
    var title = D.title.replace("（" + D.grade + "）", "").replace("2026-2027学年第一学期全日制", "");
    els.headerTitle.textContent = title;
    els.headerSub.textContent = D.semester + " · " + D.program;
  }

  /* ---------- 刷新 ---------- */
  function refresh() {
    updateHeader();
    renderWeekBar();
    renderWeekNote();
    renderWeekView();
    renderWeekPicker();
  }


  /* ---------- 启动 ---------- */
  function init() {
    // 首载默认视图：SMART_DEFAULT=true 时，按真实周周末是否有安排自动选择完整周/仅工作日
    if (!scopeUserChanged) {
      showWeekends = SMART_DEFAULT ? weekendHasArrangement(defaultWeek()) : true;
    }
    els.prevWeek.addEventListener("click", function () {
      followToday = false;
      if (currentWeek > 1) { currentWeek--; refresh(); }
    });
    els.nextWeek.addEventListener("click", function () {
      followToday = false;
      if (currentWeek < TOTAL_WEEKS) { currentWeek++; refresh(); }
    });
    els.weekLabel.addEventListener("click", function () {
      if (els.weekPicker.classList.contains("open")) closePicker();
      else openPicker();
    });
    els.weekTodayBtn.addEventListener("click", function () {
      currentWeek = defaultWeek();
      followToday = true;
      closePicker();
      refresh();
      setTimeout(scrollToToday, 80);
    });
    function setScope(v) {
      scopeUserChanged = true;
      showWeekends = v;
      refresh();
      setTimeout(scrollToToday, 80);
    }
    els.scopeWork.addEventListener("click", function () { setScope(false); });
    els.scopeAll.addEventListener("click", function () { setScope(true); });
    els.weekNoteAct.addEventListener("click", function () { setScope(true); });

    // 课程卡点击 → 课程详情弹窗（事件委托）
    (function () {
      var mm = courseModal();
      document.addEventListener("click", function (e) {
        var t = e.target;
        var blk = t && t.closest ? t.closest(".course-block") : null;
        if (blk) openCourseModal(blk);
      });
      mm.close.addEventListener("click", function (e) {
        e.stopPropagation();
        closeCourseModal();
      });
      mm.mask.addEventListener("click", function (e) {
        if (e.target === mm.mask) closeCourseModal();
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") { closeCourseModal(); closeOrigModal(); }
      });
    })();

    // 底部“原始课程表”入口 → 原表弹层
    els.origEntry.addEventListener("click", openOrigModal);
    (function () {
      var om = origModal();
      om.close.addEventListener("click", function (e) {
        e.stopPropagation();
        closeOrigModal();
      });
      om.mask.addEventListener("click", function (e) {
        if (e.target === om.mask) closeOrigModal();
      });
    })();

    document.addEventListener("click", function (e) {
      if (els.weekPicker.classList.contains("open") &&
          !els.weekPicker.contains(e.target) && !els.weekLabel.contains(e.target)) {
        closePicker();
      }
    });

    renderNotes();
    refresh();
    scrollToToday();
    initClock();
  }

  document.readyState === "loading"
    ? document.addEventListener("DOMContentLoaded", init)
    : init();
})();
</script>
</body>
</html>
