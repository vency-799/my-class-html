<style>
/* ============ 设计 Token ============ */
:root {
  /* macOS 系统色板（浅色外观） */
  --color-primary: #007AFF;            /* 系统蓝 */
  --color-morning: #0A84FF;            /* 上午 · 蓝 */
  --color-afternoon: #30D158;          /* 下午 · 绿 */
  --color-evening: #AF52DE;            /* 晚上 · 紫 */
  --color-text: #1D1D1F;               /* 主文字（macOS 近黑） */
  --color-text-secondary: #6E6E73;     /* 次级文字 */
  --color-text-tertiary: #8E8E93;      /* 弱化文字 */
  --color-bg: #F5F5F7;                 /* 页面背景（macOS 浅灰） */
  --color-surface: #FFFFFF;            /* 卡片面 */
  --color-border: #D2D2D7;             /* 分隔线 */
  --color-success: #34C759;            /* 系统绿 */
  --color-warn: #FF9F0A;               /* 系统橙 */

  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;

  --text-2xl: 20px;
  --text-xl: 17px;
  --text-base: 15px;
  --text-sm: 13px;
  --text-xs: 12px;

  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 8px;

  --shadow-card: 0 1px 1px rgba(0, 0, 0, .04), 0 2px 8px rgba(0, 0, 0, .06);
  --shadow-card-hover: 0 2px 4px rgba(0, 0, 0, .04), 0 10px 28px rgba(0, 0, 0, .10);
}

/* ============ 基础 ============ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: 1.6;
  color: var(--color-text);
  background: var(--color-bg);
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
a { color: inherit; text-decoration: none; }

.app {
  max-width: 1080px;
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 0px) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ============ 顶部标题栏 ============ */
.app-header {
  position: sticky; top: 0; z-index: 20;
  background: rgba(245, 245, 247, .78);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--color-border);
}
.header-inner {
  max-width: 1080px; margin: 0 auto;
  padding: 12px 16px 8px;
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
}
.header-title {
  font-size: var(--text-2xl); font-weight: 700; color: var(--color-text);
  letter-spacing: .2px;
}
.header-sub { font-size: var(--text-sm); color: var(--color-text-secondary); font-weight: 400; white-space: nowrap; }

/* ============ 周选择器 ============ */
.week-bar {
  max-width: 1080px; margin: 0 auto;
  padding: 6px 16px 4px;
  display: flex; align-items: center; gap: 8px;
}
.week-arrow {
  flex: 0 0 auto;
  width: 40px; height: 40px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  color: var(--color-text-secondary);
  transition: transform .15s ease-out, background .2s;
}
.week-arrow:active { transform: scale(.92); }
.week-arrow:disabled { opacity: .35; cursor: default; }
.week-arrow:disabled:active { transform: none; }
.week-arrow svg { width: 18px; height: 18px; }
.week-label {
  flex: 1 1 auto; min-width: 0;
  height: 40px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  color: var(--color-text);
  font-size: var(--text-base); font-weight: 700;
  letter-spacing: .3px;
  box-shadow: var(--shadow-card);
  transition: transform .15s ease-out, filter .2s;
}
.week-label:active { transform: scale(.97); }
.week-label .week-dates {
  font-size: var(--text-xs); font-weight: 500; opacity: .85;
  font-variant-numeric: tabular-nums;
}
.week-label .chevron { width: 14px; height: 14px; opacity: .7; transition: transform .25s ease-out; }
.week-label.open .chevron { transform: rotate(180deg); }

/* 返回本周按钮：位于周选择面板顶部，远离箭头避免误触 */
.week-today-btn {
  width: 100%; height: 44px; border-radius: 12px;
  font-size: var(--text-sm); font-weight: 600;
  color: var(--color-text);
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  display: none; align-items: center; justify-content: center; gap: 6px;
  margin-bottom: 10px;
  transition: transform .15s ease-out, background .2s;
}
.week-today-btn:active { transform: scale(.97); }
.week-today-btn svg { width: 16px; height: 16px; }
.week-today-btn.visible { display: flex; }

/* 周选择面板 */
.week-picker {
  max-width: 1080px; margin: 0 auto;
  padding: 0 16px 10px;
  display: none;
}
.week-picker.open { display: block; animation: fadeDown .18s ease-out; }
@keyframes fadeDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.week-picker-inner {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: 12px;
  box-shadow: var(--shadow-card);
}
.week-picker-title { font-size: var(--text-xs); color: var(--color-text-tertiary); margin-bottom: 8px; font-weight: 600; }
.week-grid-pick {
  display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px;
}
.week-pick-btn {
  height: 40px; border-radius: 10px;
  font-size: var(--text-sm); font-weight: 600;
  color: var(--color-text-secondary);
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.25;
  transition: transform .12s ease-out, background .15s, color .15s;
}
.week-pick-btn small { font-size: 10px; font-weight: 400; opacity: .65; }
.week-pick-btn:active { transform: scale(.94); }
.week-pick-btn[aria-pressed="true"] {
  background: rgba(0, 122, 255, .12);
  color: var(--color-primary);
  border-color: rgba(0, 122, 255, .35);
  font-weight: 700;
}
.week-pick-btn.no-course { opacity: .45; }
.week-pick-btn:focus-visible {
  outline: 2px solid var(--color-primary); outline-offset: 2px;
}

/* ============ 主内容 ============ */
main { padding: 12px 16px 40px; max-width: 1080px; margin: 0 auto; }

.week-empty-banner {
  background: var(--color-surface);
  border: 1px dashed var(--color-border);
  border-radius: var(--radius-md);
  padding: 22px 16px;
  text-align: center;
  font-size: var(--text-sm); color: var(--color-text-tertiary);
  margin-bottom: 16px;
}
.week-empty-banner svg { width: 26px; height: 26px; opacity: .5; margin-bottom: 6px; }

/* ============ 周视图：时间轴课表 ============ */
/* 左侧为时间轴列，右侧周一~周五 5 列；表头一行 + 轨道一行，
   课程按上课时段绝对定位，块高度 = 课时在一天中的占比 */
.week-view {
  --track-h: 400px;
  display: grid;
  grid-template-columns: 34px repeat(5, minmax(0, 1fr));
  grid-template-rows: 40px var(--track-h);
  column-gap: 6px;
  row-gap: 0;
  align-items: stretch;
  padding: 2px 2px 12px;
}

/* 左上角：时间轴表头 */
.axis-head {
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; color: var(--color-text-tertiary);
}

/* 日期表头（周一~周五） */
.day-head {
  display: flex; align-items: center; justify-content: center;
  flex-wrap: wrap; column-gap: 4px;
  height: 40px;
  padding: 0 4px;
  overflow: hidden;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md) var(--radius-md) 0 0;
}
.day-head.is-today {
  border-color: rgba(52, 199, 89, .55);
  background: linear-gradient(180deg, rgba(0, 122, 255, .07), var(--color-surface));
}
.day-name { font-size: 12px; font-weight: 700; color: var(--color-text); white-space: nowrap; }
.day-date { font-size: 10px; color: var(--color-text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 左侧时间轴（与轨道同高，刻度按时间百分比定位） */
.time-axis { position: relative; }
.axis-mark {
  position: absolute; left: 0; right: 0; transform: translateY(-50%);
  text-align: center;
  font-size: 9px; line-height: 1; color: var(--color-text-tertiary);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}

/* 每日轨道：相对定位容器 */
.day-track {
  position: relative;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-top: none;
  border-radius: 0 0 var(--radius-md) var(--radius-md);
  overflow: hidden;
}
.day-track.is-today {
  border-color: rgba(52, 199, 89, .55);
  box-shadow: inset 0 0 0 1px rgba(52, 199, 89, .25);
}

/* 课程块：按 top%/height% 定位，高度对应课时占比 */
.course-block {
  position: absolute; left: 2px; right: 2px;
  border-radius: 8px;
  border: 1px solid rgba(0, 0, 0, .06);
  padding: 3px 5px;
  display: flex; flex-direction: column; gap: 2px;
  overflow: hidden;
  background: var(--color-surface);
}
.course-block.morning   { background: rgba(10, 132, 255, .05); }
.course-block.afternoon { background: rgba(52, 199, 89, .05); }
.course-block.evening   { background: rgba(175, 82, 222, .05); }
.course-block::before {
  content: ""; position: absolute; left: 0; top: 4px; bottom: 4px;
  width: 3px; border-radius: 0 2px 2px 0;
}
.course-block.morning::before   { background: var(--color-morning); }
.course-block.afternoon::before { background: var(--color-afternoon); }
.course-block.evening::before   { background: var(--color-evening); }
.cb-time {
  font-size: 9px; color: var(--color-text-tertiary); line-height: 1.1;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.cb-name {
  font-size: 11px; font-weight: 600; line-height: 1.3;
  overflow-wrap: anywhere;
}
.cb-teacher, .cb-location {
  font-size: 10px; color: var(--color-text-secondary); line-height: 1.2;
  overflow-wrap: anywhere;
}

/* 全天无课 / 节假日放假 */
.day-empty {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: var(--text-xs); color: var(--color-text-tertiary);
}
.note-body li.contact {
  color: var(--color-text-tertiary);
  font-variant-numeric: tabular-nums;
}
.note-body li.contact .two { letter-spacing: .5em; }
.note-body li.contact .c-phone { font-variant-numeric: tabular-nums; }

/* ============ 备注折叠区 ============ */
.notes { margin-top: 28px; }
.notes-title {
  font-size: var(--text-base); font-weight: 700;
  color: var(--color-text-secondary);
  margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
}
.notes-title svg { width: 16px; height: 16px; opacity: .8; }
.note-panel {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  margin-bottom: 10px;
  overflow: hidden;
}
.note-summary {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px;
  font-size: var(--text-base); font-weight: 600;
  cursor: pointer;
  list-style: none;
}
.note-summary::-webkit-details-marker { display: none; }
.note-summary .note-icon { display: inline-flex; align-items: center; gap: 8px; }
.note-summary .note-icon svg { width: 17px; height: 17px; opacity: .7; }
.note-summary .chevron {
  width: 18px; height: 18px; opacity: .6;
  transition: transform .25s ease-out;
}
details[open] .note-summary .chevron { transform: rotate(180deg); }
.note-body { padding: 0 16px 14px; }
.note-body ul { list-style: none; }
.note-body li {
  position: relative; padding: 6px 0 6px 14px;
  font-size: var(--text-sm); color: var(--color-text-secondary);
  line-height: 1.7;
}
.note-body li::before {
  content: ""; position: absolute; left: 0; top: 14px;
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--color-text-tertiary);
}
.note-body li.adjust::before { background: var(--color-warn); }

.hidden { display: none !important; }


@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>

<script>
(function () {
  "use strict";
  var D = window.SCHEDULE_DATA;

  /* ---------- 教学周参数 ---------- */
  var TOTAL_WEEKS = 20;                       // 校历共 20 个教学周（2026-09-07 ~ 2027-01-24），课程自第 2 周起
  var TERM_START = new Date(2026, 8, 6);      // 2026-09-06（周日），第 1 周起点

  // 一天时间轴刻度：08:00（第480分钟）~ 21:30（第1290分钟）
  var DAY_START = 480;
  var DAY_END = 1290;
  var DAY_TOTAL = DAY_END - DAY_START;

  var periodMeta = {
    morning:   { label: "上午",  time: "8:30-11:50", className: "morning",   start: 510,  end: 710 },
    afternoon: { label: "下午",  time: "14:00-17:10", className: "afternoon", start: 840,  end: 1030 },
    evening:   { label: "晚上",  time: "18:30-21:00", className: "evening",  start: 1110, end: 1260 }
  };

  // 法定节假日（2026-2027 第一学期；仅周一~周五放假当天无课）
  var HOLIDAYS = {
    "2026-9-25": "中秋节",
    "2026-10-1": "国庆节",
    "2026-10-2": "国庆节",
    "2026-10-5": "国庆节",
    "2026-10-6": "国庆节",
    "2026-10-7": "国庆节",
    "2027-1-1": "元旦"
  };
  function holidayOf(d) {
    return HOLIDAYS[d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate()] || null;
  }

  var currentWeek = defaultWeek();
  var followToday = true;   // 跟随"真实当前周"：刷新自动定位；手动切周后暂停，返回本周恢复

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    headerTitle: $("headerTitle"), headerSub: $("headerSub"),
    weekLabel: $("weekLabel"), weekLabelMain: $("weekLabelMain"), weekLabelDates: $("weekLabelDates"),
    weekPicker: $("weekPicker"), weekGridPick: $("weekGridPick"),
    prevWeek: $("prevWeek"), nextWeek: $("nextWeek"), weekTodayBtn: $("weekTodayBtn"),
    weekView: $("weekView"), weekEmptyBanner: $("weekEmptyBanner"),
    noteAdjustList: $("noteAdjustList"), noteArrangeList: $("noteArrangeList"), noteContactList: $("noteContactList")
  };

  /* ---------- 工具 ---------- */
  function defaultWeek() {
    var now = new Date();
    var diffDays = Math.floor((now - TERM_START) / 86400000);
    var wk = Math.floor(diffDays / 7) + 1;
    return Math.min(Math.max(wk, 1), TOTAL_WEEKS);
  }

  function weekDates(w) {
    // 返回该周周一 ~ 周五的 Date 数组
    var monday = new Date(TERM_START.getTime() + (w - 1) * 7 * 86400000 + 1 * 86400000);
    var arr = [];
    for (var i = 0; i < 5; i++) arr.push(new Date(monday.getTime() + i * 86400000));
    return arr;
  }

  function fmtDate(d) {
    return (d.getMonth() + 1) + "月" + d.getDate() + "日";
  }

  function fmtRange(w) {
    var dates = weekDates(w);
    return fmtDate(dates[0]) + " - " + fmtDate(dates[4]);
  }

  function parseWeeks(nature) {
    // "2-9周" → [2,9]；"从第二周开始" → [2, TOTAL]；无 → [1, TOTAL]
    if (!nature) return [1, TOTAL_WEEKS];
    var m = nature.match(/(\d+)\s*[-—~至]\s*(\d+)\s*周/);
    if (m) return [parseInt(m[1], 10), parseInt(m[2], 10)];
    m = nature.match(/从第?([一二三四五六七八九十\d]+)周/);
    if (m) {
      var cn = m[1];
      var num = "一二三四五六七八九".indexOf(cn) + 1;
      if (cn === "十") num = 10;
      if (/^\d+$/.test(cn)) num = parseInt(cn, 10);
      if (num >= 1) return [num, TOTAL_WEEKS];
    }
    return [1, TOTAL_WEEKS];
  }

  function courseInWeek(c, w) {
    var r = parseWeeks(c.nature);
    return w >= r[0] && w <= r[1];
  }

  function weekHasCourse(w) {
    for (var i = 0; i < D.days.length; i++) {
      for (var pid in periodMeta) {
        var list = D.days[i].courses[pid] || [];
        for (var j = 0; j < list.length; j++) {
          if (courseInWeek(list[j], w)) return true;
        }
      }
    }
    return false;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function todayIdx() {
    var now = new Date();
    var d = now.getDay();
    return (d >= 1 && d <= 5) ? d - 1 : -1;
  }

  function isCurrentWeek() {
    var now = new Date();
    var diffDays = Math.floor((now - TERM_START) / 86400000);
    var wk = Math.floor(diffDays / 7) + 1;
    return wk === currentWeek;
  }

  /* 将今天的卡片滚动到可视范围内（仅当前周且已开学时；周视图已改为多列网格，无需横向滚动） */
  function scrollToToday() {
    var now = new Date();
    var diffDays = Math.floor((now - TERM_START) / 86400000);
    if (diffDays < 0 || !isCurrentWeek()) return;
    var t = todayIdx();
    if (t < 0) return;
    var el = document.getElementById("day-" + t);
    if (el && el.scrollIntoView) {
      try { el.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" }); } catch (e) {}
    }
  }

  /* 轻量时钟：每分钟检查一次日期；
     ① 跨周（跟随模式下）→ 自动定位到新周
     ② 同周跨天 → 自动刷新"今天"高亮并滚动到新今天列
     手动切到其他周时保持不动，尊重用户选择 */
  function dayKey(d) {
    return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
  }
  var lastDayKey = dayKey(new Date());

  function initClock() {
    setInterval(function () {
      var now = new Date();
      var k = dayKey(now);
      if (k === lastDayKey) return;   // 日期未变，跳过
      lastDayKey = k;
      var w = defaultWeek();
      var viewIsRealWeek = (w === currentWeek);
      if (viewIsRealWeek || followToday) {
        currentWeek = w;
        refresh();
        setTimeout(scrollToToday, 80);
      }
      // 手动看其他周（非跟随）→ 保持不动
    }, 60000);
  }

  /* ---------- 渲染：周选择器 ---------- */
  function renderWeekBar() {
    els.weekLabelMain.textContent = "第 " + currentWeek + " 周";
    els.weekLabelDates.textContent = fmtRange(currentWeek);
    els.prevWeek.disabled = currentWeek <= 1;
    els.nextWeek.disabled = currentWeek >= TOTAL_WEEKS;
    // 是否显示"返回本周"（只要当前不在真实周就显示，开学前也允许）
    var now = new Date();
    var diffDays = Math.floor((now - TERM_START) / 86400000);
    var realWeek = Math.min(Math.max(Math.floor(diffDays / 7) + 1, 1), TOTAL_WEEKS);
    if (realWeek !== currentWeek) {
      els.weekTodayBtn.classList.add("visible");
    } else {
      els.weekTodayBtn.classList.remove("visible");
    }
  }

  function renderWeekPicker() {
    var html = "";
    for (var w = 1; w <= TOTAL_WEEKS; w++) {
      var has = weekHasCourse(w);
      var pressed = w === currentWeek ? ' aria-pressed="true"' : "";
      var noCls = has ? "" : " no-course";
      var dates = weekDates(w);
      var label = "第" + w + "周";
      var sub = (dates[0].getMonth() + 1) + "/" + dates[0].getDate();
      html += '<button class="week-pick-btn' + noCls + '" data-week="' + w + '"' + pressed + '>' +
        label + "<small>" + sub + "</small></button>";
    }
    els.weekGridPick.innerHTML = html;
    els.weekGridPick.querySelectorAll(".week-pick-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        currentWeek = parseInt(btn.dataset.week, 10);
        followToday = false;
        closePicker();
        refresh();
      });
    });
  }

  function openPicker() {
    renderWeekPicker();
    els.weekPicker.classList.add("open");
    els.weekLabel.classList.add("open");
    els.weekLabel.setAttribute("aria-expanded", "true");
  }
  function closePicker() {
    els.weekPicker.classList.remove("open");
    els.weekLabel.classList.remove("open");
    els.weekLabel.setAttribute("aria-expanded", "false");
  }

  /* ---------- 渲染：整周视图（时间轴课表） ---------- */
  function renderWeekView() {
    var dates = weekDates(currentWeek);
    var tIdx = todayIdx();
    var anyCourse = false;
    var html = "";

    function pct(mins) { return (mins - DAY_START) / DAY_TOTAL * 100; }

    // 左上角：时间轴表头
    html += '<div class="axis-head">时间</div>';

    // 表头行：周一~周五（周几 + 日期 + 节假日标记）
    D.days.forEach(function (day, i) {
      var d = dates[i];
      var isToday = (isCurrentWeek() && i === tIdx);
      html += '<div class="day-head' + (isToday ? " is-today" : "") + '">';
      html += '<span class="day-name">' + day.name + "</span>";
      html += '<time class="day-date" datetime="' + d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate() + '">' + fmtDate(d) + "</time>";
      html += "</div>";
    });

    // 左侧时间轴刻度（每小时整点）
    html += '<div class="time-axis" aria-hidden="true">';
    for (var h = 8; h <= 21; h++) {
      html += '<span class="axis-mark" style="top:' + pct(h * 60).toFixed(3) + '%">' + h + ":00</span>";
    }
    html += "</div>";

    // 轨道行：周一~周五；法定节假日当天显示放假，否则课程块按时段定位、高度按课时占比
    D.days.forEach(function (day, i) {
      var isToday = (isCurrentWeek() && i === tIdx);
      var cls = isToday ? " is-today" : "";
      var d = dates[i];
      var hol = holidayOf(d);
      var dayHas = false;
      var track = '<div class="day-track' + cls + '" id="day-' + i + '">';

      if (hol) {
        track += '<div class="day-empty">无课</div>';
      } else {
        D.periods.forEach(function (p) {
          var meta = periodMeta[p.id];
          var courses = (day.courses[p.id] || []).filter(function (c) { return courseInWeek(c, currentWeek); });
          if (courses.length === 0) return; // 该时段无课则不显示
          dayHas = true;
          anyCourse = true;
          var top = pct(meta.start);
          var hgt = (meta.end - meta.start) / DAY_TOTAL * 100;
          courses.forEach(function (c) {
            track += '<div class="course-block ' + meta.className + '" style="top:' + top.toFixed(3) + '%;height:' + hgt.toFixed(3) + '%">';
            track += '<div class="cb-time">' + meta.time + "</div>";
            track += '<div class="cb-name">' + escapeHtml(c.name) + "</div>";
            if (c.teacher) track += '<div class="cb-teacher">' + escapeHtml(c.teacher) + "</div>";
            if (c.location) track += '<div class="cb-location">' + escapeHtml(c.location) + "</div>";
            track += "</div>";
          });
        });

        if (!dayHas) track += '<div class="day-empty">无课</div>';
      }
      track += "</div>";
      html += track;
    });

    els.weekView.innerHTML = html;
    // 整周无课（含节假日）→ 隐藏课表，仅显示"本周暂无课程安排"
    els.weekView.classList.toggle("hidden", !anyCourse);
    els.weekEmptyBanner.classList.toggle("hidden", anyCourse);
  }

  /* ---------- 渲染：备注 ---------- */
  function renderNotes() {
    var a = "";
    (D.notes.adjust || []).forEach(function (t) { a += '<li class="adjust">' + escapeHtml(t) + "</li>"; });
    els.noteAdjustList.innerHTML = a;
    var b = "";
    (D.notes.arrange || []).forEach(function (t) { b += "<li>" + escapeHtml(t) + "</li>"; });
    els.noteArrangeList.innerHTML = b;
    // 任课教师联系方式（按教师去重）
    var c = "", seen = {};
    D.days.forEach(function (day) {
      for (var pid in periodMeta) {
        var list = day.courses[pid] || [];
        for (var j = 0; j < list.length; j++) {
          var cur = list[j];
          if (cur.teacher && cur.phone && !seen[cur.teacher]) {
            seen[cur.teacher] = true;
            var t = escapeHtml(cur.teacher);
            if (cur.teacher.length === 2) t = '<span class="two">' + t + "</span>";
            c += '<li class="contact">' + t + "：<span class='c-phone'>" + escapeHtml(cur.phone) + "</span></li>";
          }
        }
      }
    });
    els.noteContactList.innerHTML = c;
  }

  /* ---------- 头部 ---------- */
  function updateHeader() {
    var title = D.title.replace("（" + D.grade + "）", "").replace("2026-2027学年第一学期全日制", "");
    els.headerTitle.textContent = title;
    els.headerSub.textContent = D.semester + " · " + D.program;
  }

  /* ---------- 刷新 ---------- */
  function refresh() {
    updateHeader();
    renderWeekBar();
    renderWeekView();
    renderWeekPicker();
  }


  /* ---------- 启动 ---------- */
  function init() {
    els.prevWeek.addEventListener("click", function () {
      followToday = false;
      if (currentWeek > 1) { currentWeek--; refresh(); }
    });
    els.nextWeek.addEventListener("click", function () {
      followToday = false;
      if (currentWeek < TOTAL_WEEKS) { currentWeek++; refresh(); }
    });
    els.weekLabel.addEventListener("click", function () {
      if (els.weekPicker.classList.contains("open")) closePicker();
      else openPicker();
    });
    els.weekTodayBtn.addEventListener("click", function () {
      var now = new Date();
      var diffDays = Math.floor((now - TERM_START) / 86400000);
      currentWeek = Math.min(Math.max(Math.floor(diffDays / 7) + 1, 1), TOTAL_WEEKS);
      followToday = true;
      closePicker();
      refresh();
      setTimeout(scrollToToday, 80);
    });
    document.addEventListener("click", function (e) {
      if (els.weekPicker.classList.contains("open") &&
          !els.weekPicker.contains(e.target) && !els.weekLabel.contains(e.target)) {
        closePicker();
      }
    });

    renderNotes();
    refresh();
    scrollToToday();
    initClock();
  }

  document.readyState === "loading"
    ? document.addEventListener("DOMContentLoaded", init)
    : init();
})();
</script>
</body>
</html>
